name: Merge passed PRs with activation note (temporary)

# 临时 workflow：合并所有校验通过的 PR，@作者留言引导到 LINUX.TG 激活域名。用完即删。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/merge-passed-prs.yml']

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge-passed:
    runs-on: ubuntu-latest
    name: Comment on and merge passed PRs
    steps:
      - name: Comment and merge
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          merged=0
          failed=0
          failed_list=""
          for pr in $(gh pr list --state open --limit 200 --json number --jq '.[].number' -R "$GITHUB_REPOSITORY"); do
            sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid -R "$GITHUB_REPOSITORY" 2>/dev/null)
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
              --jq '.statuses[0].state' 2>/dev/null)
            [ "$state" = "success" ] || continue
            author=$(gh pr view "$pr" --json author --jq .author.login -R "$GITHUB_REPOSITORY" 2>/dev/null)

            cat > /tmp/comment.md <<EOF
          @$author Great news — your application passed validation and this pull request is now being merged! 🎉

          **One last step to activate your domain:**

          1. **Register at [LINUX.TG](https://linux.tg)** and verify your GitHub account (at least two years old).
          2. **Open the [web panel](https://linux.tg/domains)** — your domain will be there, ready to activate.
            3. **Manage it anytime** — day-to-day changes, and applying for more domains whenever you need them, all happen in the same place.

          Welcome aboard! 👋
          EOF

            gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -F body=@/tmp/comment.md --jq .id >/dev/null 2>&1
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" -f merge_method=merge --jq .merged 2>/dev/null | grep -q "true"; then
              echo "Merged #$pr (author: @$author)"
              merged=$((merged + 1))
            else
              echo "Could not merge #$pr — leaving it open"
              failed=$((failed + 1))
              failed_list="$failed_list #$pr"
            fi
            sleep 1
          done
          echo "MERGED=$merged FAILED=$failed"
          echo "Merge failures:$failed_list"
