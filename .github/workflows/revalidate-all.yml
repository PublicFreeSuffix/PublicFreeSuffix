name: Revalidate all open PRs (temporary)

# 临时 workflow：推送后为所有开放 PR 重新触发 validate-pr 校验，用完即删
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/revalidate-all.yml']

permissions:
  actions: write
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    name: Dispatch validation for every open PR
    steps:
      - name: Dispatch validation for every open PR
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          count=0
          failed=0
          for pr in $(gh pr list --state open --limit 200 --json number --jq '.[].number' -R "$GITHUB_REPOSITORY"); do
            echo "Dispatching validation for PR #$pr"
            if gh workflow run validate-pr.yml -f pr_number="$pr" -R "$GITHUB_REPOSITORY"; then
              count=$((count + 1))
            else
              failed=$((failed + 1))
              echo "Failed to dispatch PR #$pr"
            fi
            sleep 2
          done
          echo "Dispatched: $count, failed: $failed"
# round 6: refresh statuses with failure-state fix
