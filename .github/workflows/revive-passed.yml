name: Revive passed PRs & conflict report (temporary)

# 临时 workflow：复活"已关闭、未合并、曾验证通过"的 PR 并重新校验；
# 汇总当前所有通过待合并 PR 的域名冲突。用完即删。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/revive-passed.yml']

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  revive-and-report:
    runs-on: ubuntu-latest
    name: Revive passed PRs, then conflict report
    steps:
      - name: Reopen closed PRs that passed validation
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          reopened=""
          count=0
          for pr in $(gh pr list --state closed --limit 300 --json number,mergedAt --jq '.[] | select(.mergedAt==null) | .number' -R "$GITHUB_REPOSITORY"); do
            passed=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
              --jq '[.[] | select((.user.login=="PublicFreeSuffix" or .user.login=="github-actions[bot]") and (.body | contains("PR Validation Passed")))] | length > 0' 2>/dev/null)
            if [ "$passed" != "true" ]; then
              sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid -R "$GITHUB_REPOSITORY" 2>/dev/null)
              if [ -n "$sha" ] && [ "$sha" != "null" ]; then
                passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
                  --jq '[.statuses[] | select(.context=="validate-pr")][-1].state == "success"' 2>/dev/null)
              fi
            fi
            [ "$passed" = "true" ] || continue
            echo "Reopening passed PR #$pr"
            if gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" -F state=open --jq .state 2>/dev/null | grep -q "^open$"; then
              reopened="$reopened $pr"
              count=$((count + 1))
            else
              echo "  could not reopen #$pr (head branch or fork may be deleted)"
            fi
            sleep 1
          done
          echo "REOPENED=$reopened" >> "$GITHUB_ENV"
          echo "Reopened $count passed PR(s):$reopened"

      - name: Wait for re-validation of reopened PRs
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          deadline=$(( $(date +%s) + 900 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            pending=0
            summary=""
            for pr in $REOPENED; do
              sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid -R "$GITHUB_REPOSITORY" 2>/dev/null)
              state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
                --jq '[.statuses[] | select(.context=="validate-pr")][-1].state // "pending"' 2>/dev/null)
              summary="$summary #$pr=$state"
              [ "$state" = "pending" ] && pending=$((pending + 1))
            done
            echo "waiting:$summary"
            [ "$pending" = "0" ] && break
            sleep 30
          done

      - name: Close reopened PRs that failed re-validation
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          kept=0
          closed=0
          for pr in $REOPENED; do
            sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid -R "$GITHUB_REPOSITORY" 2>/dev/null)
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
              --jq '[.statuses[] | select(.context=="validate-pr")][-1].state // "pending"' 2>/dev/null)
            if [ "$state" = "success" ]; then
              echo "✅ PR #$pr re-passed — kept open, awaiting manual merge"
              kept=$((kept + 1))
            else
              echo "❌ PR #$pr validation state: $state — closing again"
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" -F state=closed --jq .state >/dev/null 2>&1
              closed=$((closed + 1))
            fi
          done
          echo "REVIVE KEPT=$kept CLOSED=$closed" >> "$GITHUB_ENV"
          echo "Revived: $kept, closed again: $closed"

      - name: Conflict report for open passed PRs
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          : > /tmp/passed.txt
          for pr in $(gh pr list --state open --limit 200 --json number --jq '.[].number' -R "$GITHUB_REPOSITORY"); do
            sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid -R "$GITHUB_REPOSITORY" 2>/dev/null)
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
              --jq '[.statuses[] | select(.context=="validate-pr")][-1].state // "pending"' 2>/dev/null)
            [ "$state" = "success" ] || continue
            file=$(gh pr diff "$pr" -R "$GITHUB_REPOSITORY" --name-only 2>/dev/null | head -1)
            [ -n "$file" ] && echo "$pr $(echo "$file" | tr '[:upper:]' '[:lower:]')" >> /tmp/passed.txt
          done
          total=$(wc -l < /tmp/passed.txt)
          echo "### Passed (awaiting merge) PRs: $total" | tee -a "$GITHUB_STEP_SUMMARY"

          echo "### ⚔️ Conflicts within the passed set" | tee -a "$GITHUB_STEP_SUMMARY"
          dupes=$(cut -d' ' -f2 /tmp/passed.txt | sort | uniq -d)
          if [ -z "$dupes" ]; then
            echo "None." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            for f in $dupes; do
              prs=$(grep " $f\$" /tmp/passed.txt | cut -d' ' -f1 | tr '\n' ' ')
              echo "- \`$f\`: PR $prs" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          fi

          echo "### 📦 Passed PRs whose domain already exists on main" | tee -a "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GITHUB_REPOSITORY/contents/whois" --jq '.[].name' 2>/dev/null | tr '[:upper:]' '[:lower:]' | sort > /tmp/main-files.txt
          stale=0
          while read -r pr file; do
            base="${file#whois/}"
            if grep -qx "$base" /tmp/main-files.txt; then
              echo "- PR #$pr → \`$base\` already on main" | tee -a "$GITHUB_STEP_SUMMARY"
              stale=$((stale + 1))
            fi
          done < /tmp/passed.txt
          [ "$stale" = "0" ] && echo "None." | tee -a "$GITHUB_STEP_SUMMARY"

          echo "### ✅ Passed set" | tee -a "$GITHUB_STEP_SUMMARY"
          awk '{print "- PR #" $1 " → `" $2 "`"}' /tmp/passed.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dump summary to log
        run: cat "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
