name: Close failed PRs with guidance (temporary)

# 临时 workflow：@作者留言引导迁移到 LINUX.TG Web 控制台，然后关闭校验未通过的 PR。用完即删。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/close-failed-prs.yml']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  close-failed:
    runs-on: ubuntu-latest
    name: Comment on and close failed PRs
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          closed=0
          for pr in $(gh pr list --state open --limit 200 --json number --jq '.[].number' -R "$GITHUB_REPOSITORY"); do
            sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid -R "$GITHUB_REPOSITORY" 2>/dev/null)
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
              --jq '.statuses[0].state' 2>/dev/null)
            [ "$state" = "success" ] && continue
            author=$(gh pr view "$pr" --json author --jq .author.login -R "$GITHUB_REPOSITORY" 2>/dev/null)

            cat > /tmp/comment.md <<EOF
          @$author Thanks for your application!

          The Public Free Suffix project has moved to a brand-new web console — domains are now applied for and managed entirely through [LINUX.TG](https://linux.tg), so this pull request is being closed.

          **Applying through the new flow is quick:**

          1. **Add your domain at a supported DNS provider first.** Our top pick is [Bunny.net DNS](https://bunny.net/dns/), followed by [He.net DNS](https://dns.he.net/) — other providers work too.
          2. **Register at [LINUX.TG](https://linux.tg)** and verify your GitHub account (it must be at least 2 years old).
          3. **Apply and manage your domains in the web panel:** [linux.tg/domains](https://linux.tg/domains) — nameserver delegation is automatic.

          See you there! 👋
          EOF

            gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -F body=@/tmp/comment.md --jq .id >/dev/null 2>&1 \
              && gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" -F state=closed --jq .state >/dev/null 2>&1
            if [ "$?" = "0" ]; then
              echo "Closed #$pr (author: @$author)"
              closed=$((closed + 1))
            else
              echo "Failed to close #$pr"
            fi
            sleep 1
          done
          echo "Closed $closed failed PR(s)"
